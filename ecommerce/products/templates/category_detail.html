{% extends 'base.html' %}

{% block title %}{{ category.name }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>{{ category.name }}</h1>
    <ul>
        {% for product in products %}
            <li><a href="{% url 'product_detail' product.id %}">{{ product.name }}</a></li>
        {% endfor %}
    </ul>
    <a href="{% url 'product_list' %}">Voir les produits</a>
</div>
{% endblock %}
