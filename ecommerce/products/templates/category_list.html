{% extends 'base.html' %}

{% block title %}Catégories{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>Catégories</h1>
    <ul>
        {% for category in categories %}
            <li><a href="{% url 'category_detail' category.id %}">{{ category.name }}</a></li>
        {% endfor %}
    </ul>
    <a href="{% url 'product_list' %}">Voir les produits</a>
</div>
{% endblock %}
